name: traceguard

services:
  web:
    image: traceguard/web:dev
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-local}
        VCS_REF: ${VCS_REF:-local}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_PUBLIC_TRACEGUARD_API_URL: ${NEXT_PUBLIC_TRACEGUARD_API_URL:-http://localhost:4000}
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [application]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://traceguard:${TRACEGUARD_DATABASE_PASSWORD:?Set TRACEGUARD_DATABASE_PASSWORD in .env}@postgres:5432/traceguard
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${TRACEGUARD_LOG_LEVEL:-info}
      NODE_ENV: development
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-traceguard-api}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/traceguard}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/traceguard/protocol/openid-connect/certs}
      PORT: 4000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks: [application, data]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/database-migrate.Dockerfile
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traceguard:${TRACEGUARD_DATABASE_PASSWORD:?Set TRACEGUARD_DATABASE_PASSWORD in .env}@postgres:5432/traceguard
    networks: [data]
    restart: "no"

  workflows:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile
    profiles: [app]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${TRACEGUARD_LOG_LEVEL:-info}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-traceguard-platform}
    networks: [application]
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    profiles: [app]
    environment:
      PORT: 8000
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [application]
    restart: unless-stopped

  postgres:
    image: postgres:18.4-bookworm
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      TRACEGUARD_DATABASE_PASSWORD: ${TRACEGUARD_DATABASE_PASSWORD:?Set TRACEGUARD_DATABASE_PASSWORD in .env}
      TEMPORAL_DATABASE_PASSWORD: ${TEMPORAL_DATABASE_PASSWORD:?Set TEMPORAL_DATABASE_PASSWORD in .env}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in .env}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-development-data:/var/lib/postgresql
      - ./infrastructure/compose/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    networks: [data, database-access]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.3-alpine
    profiles: [core]
    command: [valkey-server, --appendonly, "no", --save, ""]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [application]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [core]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/data
    networks: [application]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/traceguard-evidence
        mc version enable local/traceguard-evidence
    networks: [application]
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.28.1
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DATABASE_PASSWORD:?Set TEMPORAL_DATABASE_PASSWORD in .env}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
    healthcheck:
      test: [CMD-SHELL, "tctl --address temporal:7233 cluster health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [application, data]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.38.3
    profiles: [tools]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8082}:8080"
    networks: [application]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    profiles: [core]
    command: [start-dev, --health-enabled=true, --import-realm]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3\""
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infrastructure/keycloak/traceguard-realm.json:/opt/keycloak/data/import/traceguard-realm.json:ro
    networks: [application, data]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.2
    profiles: [tools]
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    networks: [application]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [application]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [application]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    profiles: [observability]
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [application]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    profiles: [observability]
    depends_on:
      - prometheus
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/traceguard.yaml:ro
    networks: [application]
    restart: unless-stopped

networks:
  application:
  database-access:
  data:
    internal: true

volumes:
  # The former postgres-data volume is intentionally left untouched. Existing
  # installations may retain it until the owner explicitly archives or removes it.
  postgres-development-data:
  minio-data:
  mailpit-data:
  prometheus-data:
  loki-data:
  grafana-data:
