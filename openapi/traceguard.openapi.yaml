openapi: 3.1.0
info:
  title: TraceGuard API
  version: 0.0.0
  description: Public HTTP contract for the TraceGuard business API and platform health endpoints.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: Same origin as the deployed API
tags:
  - name: Platform
    description: Process and dependency health endpoints.
  - name: Access
    description: Authenticated identity and organization access endpoints.
  - name: Organizations
    description: Organization onboarding and settings endpoints.
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      tags: [Platform]
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        4XX:
          description: The health request was rejected by an access or request policy.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API can serve requests
      tags: [Platform]
      security: []
      responses:
        "200":
          description: The API and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        4XX:
          description: The health request was rejected by an access or request policy.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/me:
    get:
      operationId: getCurrentIdentity
      summary: Get the authenticated identity and authorized organizations
      tags: [Access]
      responses:
        "200":
          description: The current identity and every organization it may access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/organizations:
    post:
      operationId: bootstrapOrganization
      summary: Create the authenticated identity's first organization
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOrganizationRequest"
      responses:
        "201":
          description: The organization was created, or the same idempotent result was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          description: The slug is unavailable, the identity already belongs to an organization, or the idempotency key was reused for different input.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          $ref: "#/components/responses/ValidationProblem"
  /v1/organizations/{slug}:
    parameters:
      - $ref: "#/components/parameters/OrganizationSlug"
    get:
      operationId: getOrganization
      summary: Get an authorized organization context
      tags: [Organizations]
      responses:
        "200":
          description: The organization context and the current identity's roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
    patch:
      operationId: updateOrganization
      summary: Update authorized organization settings
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: The successor organization version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/OrganizationAccessDenied"
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
        "409":
          description: The supplied row version is stale.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          $ref: "#/components/responses/ValidationProblem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for one organization-bootstrap intent. Reusing it with different input is rejected.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    OrganizationSlug:
      name: slug
      in: path
      required: true
      description: Immutable human-readable organization route key.
      schema:
        $ref: "#/components/schemas/OrganizationSlug"
  responses:
    AuthenticationRequired:
      description: Authentication is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    OrganizationNotFound:
      description: The organization does not exist or is not accessible to the current identity.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    OrganizationAccessDenied:
      description: The current identity belongs to the organization but lacks authority for this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationProblem:
      description: The request did not satisfy the organization-access contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    MembershipRole:
      type: string
      enum: [admin, quality_analyst, recall_coordinator, approver]
    OrganizationSlug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      examples: [acme-foods]
    TimeZone:
      type: string
      description: IANA time-zone identifier used for organization-local display and scheduling.
      minLength: 1
      maxLength: 100
      examples: [Asia/Ho_Chi_Minh]
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug, timeZone, rowVersion, roles]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          $ref: "#/components/schemas/OrganizationSlug"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        rowVersion:
          type: integer
          minimum: 1
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MembershipRole"
    OrganizationDetail:
      type: object
      additionalProperties: false
      required:
        [id, name, slug, timeZone, rowVersion, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          $ref: "#/components/schemas/OrganizationSlug"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        rowVersion:
          type: integer
          minimum: 1
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MembershipRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CurrentIdentity:
      type: object
      additionalProperties: false
      required: [id, issuer, subject, organizations]
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
          format: uri
        subject:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationSummary"
    BootstrapOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug, timeZone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          $ref: "#/components/schemas/OrganizationSlug"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, timeZone, rowVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        rowVersion:
          type: integer
          minimum: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok]
    ProblemDetails:
      type: object
      description: RFC 9457 problem detail returned by TraceGuard HTTP APIs.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
