name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - frontend
      - backend

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and build
        run: just check

      - name: Validate repository licensing
        run: just license-audit

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Validate Compose model
        run: |
          just env
          docker compose --profile core --profile tools --profile observability config --quiet
